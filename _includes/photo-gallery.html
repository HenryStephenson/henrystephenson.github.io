<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

* {
  box-sizing: border-box;
}

img {
  vertical-align: middle;
}

/* Position the image container (needed to position the left and right arrows) */
.container {
  position: relative;
}

/* Hide the images by default */
.mySlides {
  display: none;
}

/* Add a pointer when hovering over the thumbnail images */
.cursor {
  cursor: pointer;
}

/* Next & previous buttons */
.prev,
.next {
  cursor: pointer;
  position: absolute;
  top: 40%;
  width: auto;
  padding: 16px;
  margin-top: -50px;
  color: white;
  font-weight: bold;
  font-size: 20px;
  border-radius: 0 3px 3px 0;
  user-select: none;
  -webkit-user-select: none;
}

/* Position the "next button" to the right */
.next {
  right: 0;
  border-radius: 3px 0 0 3px;
}

/* On hover, add a black background color with a little bit see-through */
.prev:hover,
.next:hover {
  background-color: rgba(0, 0, 0, 0.8);
}

/* Container for image text */
.caption-container p {
  text-align: center;
  background-color: #222;
  padding: 8px 16px;
  color: white;
  font-style: normal;
  font-size: 16px;
}

.row:after {
  content: "";
  display: table;
  clear: both;
}

/* Six columns side by side */
.column {
  float: left;
  width: 16.66%;
}

/* Add a transparency effect for thumnbail images */
.demo {
  opacity: 0.6;
}

.active,
.demo:hover {
  opacity: 1;
}
</style>

<body>

<h1 style="text-align:center">Action Shots</h1>

<div class="container">
  <div class="mySlides">
    <center><img src="../assets/images/hadfield.JPG" style="width:80%"></center>
  </div>

  <div class="mySlides">
    <center><img src="../assets/images/gpa.PNG" style="width:80%"></center>
  </div>
  
  <div class="mySlides">
    <center><img src="../assets/images/soccer-photo.jpg" style="width:80%"></center>
  </div>

  <div class="mySlides">
    <center><img src="../assets/images/wrestle.PNG" style="width:80%"></center>
  </div>

  <div class="mySlides">
    <center><img src="../assets/images/piano.jpg" style="width:80%"></center>
  </div>
    
  <div class="mySlides">
    <center><img src="../assets/images/igem.jpg" style="width:80%"></center>
  </div>

  <div class="mySlides">
    <center><img src="../assets/images/keira.JPEG" style="width:80%"></center>
  </div>
    
  <div class="mySlides">
    <center><img src="../assets/images/randy_rettberg.JPG" style="width:80%"></center>
  </div>

  <div class="mySlides">
    <center><img src="../assets/images/pipette.jpg" style="width:80%"></center>
  </div>

  <div class="mySlides">
    <center><img src="../assets/images/igem_poster.jpg" style="width:80%"></center>
  </div>

  <div class="mySlides">
    <center><img src="../assets/images/igem_win.JPG" style="width:80%"></center>
  </div>

  <div class="mySlides">
    <center><img src="../assets/images/nomic.PNG" style="width:80%"></center>
  </div>

  <div class="mySlides">
    <center><img src="../assets/images/ipd_poster.JPG" style="width:80%"></center>
  </div>
    
  <a class="prev" onclick="plusSlides(-1)">❮</a>
  <a class="next" onclick="plusSlides(1)">❯</a>

  <div class="caption-container">
    <p id="caption"></p>
  </div>
</div>

<script>
let slideIndex = Math.floor(Math.random() * 13) + 1; // pick a random slide 1–13

// Captions for each photo (in the same order as the slides)
const captions = [
  "My brother and I meeting Commander Chris Hadfield",
  "My academic excellence snapshot when applying for unviersities",
  "My Durham FC portrait in grade 11",
  "For my valedictorian video, my gym teacher agreed to do a wrestling skit",
  "Playing piano for a McGill ball",
  "Some laughs in the iGEM lab",
  "Dancing with Keira, my girlfriend and best friend",
  "Photo at SynBioBeta Conference with iGEM President Randy Rettberg",
  "Questionable sterility in the lab",
  "Presenting my iGEM poster at a McGill symposium",
  "Winning moment at iGEM Competition in Paris",
  "The Nomic team while I was interning",
  "Presenting my poster from my time at Baker Lab at the IPD"
];

showSlides(slideIndex);

function plusSlides(n) {
  showSlides(slideIndex += n);
}

function showSlides(n) {
  let slides = document.getElementsByClassName("mySlides");
  let captionText = document.getElementById("caption");
  if (n > slides.length) {slideIndex = 1}
  if (n < 1) {slideIndex = slides.length}
  for (let i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  slides[slideIndex-1].style.display = "block";
  captionText.innerHTML = captions[slideIndex-1];
}
</script>
    
</body>
</html>
